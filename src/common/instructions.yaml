android_tv:
  label: "📺 Android TV"
  text: |
    <b>Инструкция для Android TV / TV Box</b>

    ⚙️ <b>Шаг 1.</b> Установите клиент на телевизор через Play Store или через APK-файл (кнопки ниже)

    ⚙️ <b>Шаг 2.</b> Запустите приложение на TV, разрешите создание VPN-соединения и откройте QR-код для импорта

    ⚙️ <b>Шаг 3.</b> В приложении Happ на телефоне нажмите <b>+</b> в правом верхнем углу, выберите <b>QR-код</b> и отсканируйте код с экрана телевизора

    ⚙️ <b>Шаг 4.</b> Выберите на телефоне нужные сервера для отправки на TV и подтвердите импорт
  downloads:
    - name: "📺 Happ Google Play"
      url: "https://play.google.com/store/apps/details?id=com.happproxy"
    - name: "📺 Happ прямой .APK"
      url: "https://github.com/Happ-proxy/happ-android/releases/latest/download/Happ.apk"

apple_tv:
  label: "🍎 Apple TV"
  text: |
    <b>Инструкция для Apple TV</b>

    ⚙️ <b>Шаг 1.</b> Откройте App Store на Apple TV (требуется tvOS 17 или новее) и установите приложение (кнопки ниже)

    ⚙️ <b>Шаг 2.</b> Запустите приложение на Apple TV
    
    ⚙️ <b>Шаг 3.</b> Вернитесь сюда, нажмите "Главное меню" -> "Меню управления подпиской"

    ⚙️ <b>Шаг 4.</b> Скопируйте ссылку на Вашу подписку и добавьте её в скачанное приложение (через единый iCloud-буфер или QR-код)
  downloads:
    - name: "🍎 App Store (Apple TV)"
      url: "https://apps.apple.com/us/app/happ-proxy-utility-for-tv/id6748297274"