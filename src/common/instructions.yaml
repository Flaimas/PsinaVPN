ios:
  label: "🍏 iOS"
  text: |
    <b>Инструкция для iOS</b>

    ⚙️ <b>Шаг 1.</b> Скачайте клиент из App Store (кнопки ниже)

    ⚙️ <b>Шаг 2.</b> При запуске нажмите <b>Allow</b> и введите пароль от iOS
    
    ⚙️ <b>Шаг 3.</b> Вернитесь сюда, нажмите "Главное меню" -> "Меню управления подпиской"

    ⚙️ <b>Шаг 4.</b> Скопируйте ссылку на Вашу подписку и вставьте её в скачанное приложение
  downloads:
    - name: "📱 Happ (RU App Store)"
      url: "https://apps.apple.com/us/app/happ-proxy-utility/id6504287215"
    - name: "📱 Happ (GLOBAL App Store)"
      url: "https://apps.apple.com/ru/app/happ-proxy-utility/id6783623643"

