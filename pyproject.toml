[project]
name = "psina-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.29.1",
    "aiohttp-socks>=0.11.0",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi>=0.140.1",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pydantic-settings>=2.14.2",
    "python-dateutil>=2.9.0.post0",
    "redis>=8.0.1",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn>=0.51.0",
    "yookassa>=3.11.0",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
]