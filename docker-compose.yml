version: '3.8'
services:
  db:
    image: postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin}
    ports:
      -5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql
  redis:
    image: redis:8.6.4
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-default_dev_password}
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: